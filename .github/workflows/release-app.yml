name: Release Signed App

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Lowercase app module slug under apps/ (e.g. notes)"
        required: true
        type: string
      version_tag:
        description: "Release tag to create (e.g. notes-v0.1.0)"
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: Build, Sign & Attest Reproducible APK
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper & Guardrails
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run platform & hardening guardrails
        run: bash scripts/ci/check-guardrails.sh

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android 17 QPR1 SDK (37.1) & Build Tools
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.1" "build-tools;37.0.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build unsigned release APK & sign in RAM with APK Signature Scheme v3.1
        env:
          APP_NAME: ${{ inputs.app_name }}
          VERSION_TAG: ${{ inputs.version_tag }}
          KEYSTORE_ENC_B64: ${{ secrets.SIGNING_KEYSTORE_ENC_B64 }}
          KEYSTORE_ENC_PASSPHRASE: ${{ secrets.SIGNING_KEYSTORE_ENC_PASSPHRASE }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$APP_NAME" | grep -Eq '^[a-z][a-z0-9]{1,24}$'; then
            echo "::error::Invalid app_name."
            exit 1
          fi
          if [ ! -f "apps/${APP_NAME}/build.gradle.kts" ]; then
            echo "::error::App module apps/${APP_NAME} does not exist yet."
            exit 1
          fi
          if [ -z "$KEYSTORE_ENC_B64" ] || [ -z "$KEYSTORE_ENC_PASSPHRASE" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing signing secrets in protected 'release' GitHub Environment."
            exit 1
          fi

          ./gradlew ":apps:${APP_NAME}:assembleRelease" --stacktrace

          UNSIGNED_APK="$(find "apps/${APP_NAME}/build/outputs/apk/release" -name '*-unsigned.apk' -o -name '*-release.apk' | head -n 1)"
          if [ -z "$UNSIGNED_APK" ]; then
            echo "::error::Release APK not found."
            exit 1
          fi

          WORK_DIR="/dev/shm/shkriuss-release-${GITHUB_RUN_ID}"
          mkdir -p "$WORK_DIR" release-out
          chmod 700 "$WORK_DIR"

          printf '%s' "$KEYSTORE_ENC_B64" | base64 -d > "${WORK_DIR}/keystore.p12.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 \
            -in "${WORK_DIR}/keystore.p12.enc" \
            -out "${WORK_DIR}/keystore.p12" \
            -pass env:KEYSTORE_ENC_PASSPHRASE

          BUILD_TOOLS_DIR="$(ls -d "${ANDROID_HOME}"/build-tools/37.* "${ANDROID_HOME}"/build-tools/36.* 2>/dev/null | sort -V | tail -n 1)"
          OUT_APK="release-out/shkriuss-${APP_NAME}-${VERSION_TAG}.apk"

          "${BUILD_TOOLS_DIR}/zipalign" -f -p 4 "$UNSIGNED_APK" "${WORK_DIR}/aligned.apk"
          "${BUILD_TOOLS_DIR}/apksigner" sign \
            --ks "${WORK_DIR}/keystore.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "shkriuss-${APP_NAME}" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT_APK" \
            "${WORK_DIR}/aligned.apk"

          "${BUILD_TOOLS_DIR}/apksigner" verify --verbose --print-certs "$OUT_APK"
          (cd release-out && sha256sum "$(basename "$OUT_APK")" > SHA256SUMS.txt)

      - name: Generate SLSA Build Level 3 provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-out/*.apk

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.app_name }}-${{ inputs.version_tag }}
          path: release-out/
          retention-days: 30

      - name: Shred RAM scratch directory
        if: always()
        run: |
          WORK_DIR="/dev/shm/shkriuss-release-${GITHUB_RUN_ID}"
          if [ -d "$WORK_DIR" ]; then
            find "$WORK_DIR" -type f -exec shred -u {} \; || true
            rm -rf "$WORK_DIR"
          fi
