name: Deploy Static Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-site-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy shkriuss.dev Static Hub
    runs-on: ubuntu-latest
    environment: site-deploy
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce static-site-only guardrail
        run: |
          if find site/public -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.ts' \) | grep -q .; then
            echo "::error::JavaScript files are forbidden in site/public/."
            exit 1
          fi
          if grep -rniE '<script\b|javascript:' site/public/; then
            echo "::error::Script tags are forbidden in site/public/."
            exit 1
          fi

      - name: Deploy static assets via Cloudflare Wrangler
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy
